<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transit Lens · Live Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0B0F1A; --card:#121829; --line:#222B40; --muted:#8B95A7;
    --text:#F4F7FF; --soft:#C7D0E0; --teal:#00B5A0; --cyan:#33C3FF; --orange:#FF6319;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; color:var(--text); font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #16203a 0%, rgba(11,15,26,0) 60%),
      radial-gradient(1000px 500px at 110% 0%, #0f2b2b 0%, rgba(11,15,26,0) 55%),
      var(--bg);
    min-height:100vh;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 22px 60px; }
  .topbar { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; }
  h1 {
    font-size:2.2rem; font-weight:800; letter-spacing:-0.5px; margin:0;
    background:linear-gradient(90deg,#00B5A0 0%,#33C3FF 50%,#7B6CFF 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:var(--muted); font-size:0.95rem; margin-top:4px; }
  .demo-tag { font-size:0.7rem; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--teal); border:1px solid var(--teal); border-radius:999px; padding:3px 10px; }
  select {
    background:var(--card); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 14px; font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  .line { height:5px; border-radius:5px; margin:18px 0 24px;
    background:linear-gradient(90deg,#007AC9 0 18%,#00985F 18% 36%,#FF6319 36% 54%,
      #8C4799 54% 72%,#00B9E4 72% 90%,#00B5A0 90% 100%); }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; position:relative; overflow:hidden; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--accent,var(--teal)); }
  .lbl { color:var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:1.5px; }
  .val { color:var(--text); font-size:1.9rem; font-weight:800; font-variant-numeric:tabular-nums;
    font-family:"DM Mono",ui-monospace,monospace; margin-top:4px; line-height:1.1; }
  .hint { color:#6C7689; font-size:0.78rem; margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:26px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .section { color:var(--soft); font-weight:700; font-size:1.05rem; margin:0 0 14px;
    padding-left:10px; border-left:3px solid var(--teal); }
  .chart-box { position:relative; height:300px; }
  .peak { color:var(--orange); font-size:0.82rem; margin-top:10px; }
  .maprow { display:grid; grid-template-columns:2fr 1fr; gap:22px; margin-top:26px; }
  #map { height:420px; border-radius:12px; border:1px solid var(--line); background:#0e1422; }
  .board { max-height:420px; overflow:auto; }
  .board table { width:100%; border-collapse:collapse; font-size:0.86rem; }
  .board th { text-align:left; color:var(--muted); font-weight:600; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:1px; padding:6px 8px; position:sticky; top:0;
    background:var(--card); }
  .board td { padding:7px 8px; border-top:1px solid var(--line); color:var(--soft); }
  .board td.num { font-variant-numeric:tabular-nums; color:var(--text); font-weight:600; }
  .bar { height:6px; border-radius:4px; background:linear-gradient(90deg,var(--teal),var(--cyan)); }
  .legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .badge { font-size:0.72rem; font-weight:600; color:#0B0F1A; border-radius:999px; padding:2px 9px; }
  .foot { color:#6C7689; font-size:0.8rem; margin-top:34px; text-align:center; }
  .foot a { color:var(--cyan); text-decoration:none; }
  @media (max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid2,.maprow{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Transit Lens</h1>
      <div class="sub" id="subtitle">GTFS delay intelligence</div>
    </div>
    <div style="display:flex; gap:12px; align-items:center;">
      <span class="demo-tag">Static demo</span>
      <select id="city"></select>
    </div>
  </div>
  <div class="line"></div>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="panel">
      <div class="section">Average delay by hour</div>
      <div class="chart-box"><canvas id="hourChart"></canvas></div>
      <div class="peak" id="peakNote"></div>
    </div>
    <div class="panel">
      <div class="section">Top 10 most delayed routes</div>
      <div class="chart-box"><canvas id="routeChart"></canvas></div>
    </div>
  </div>

  <div class="maprow">
    <div class="panel">
      <div class="section">Busiest stops</div>
      <div id="map"></div>
    </div>
    <div class="panel">
      <div class="section">Top stops</div>
      <div class="board"><table id="stopTable">
        <thead><tr><th>#</th><th>Stop</th><th>Events</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="foot">
    Static snapshot of the dbt marts, built by <code>dashboard/build_demo.py</code>.
    The live app is the Streamlit dashboard (<code>python main.py</code>).
  </div>
</div>

const MODES = {
  Tram:"#00985F", Metro:"#FF6319", Rail:"#8C4799", Bus:"#007AC9",
  Ferry:"#00B9E4", "Suburban rail":"#8C4799", Other:"#9AA4B2"
};
let hourChart, routeChart, map, markerLayer;

function kpis(d) {
  const routes = d.top_routes;
  const avg = routes.length ? routes.reduce((s,r)=>s+r.avg_delay_seconds,0)/routes.length : 0;
  const worst = routes[0];
  const cards = [
    ["Top routes shown", routes.length.toLocaleString(), "by avg delay", "#007AC9"],
    ["Stops", d.total_stops.toLocaleString(), "scheduled network", "#00985F"],
    ["Avg delay", avg.toFixed(1)+"s", "across shown routes", "#FF6319"],
    ["Worst route", worst ? worst.name : "-",
      worst ? worst.avg_delay_seconds.toFixed(0)+"s avg" : "", worst ? worst.color : "#00B5A0"],
  ];
  document.getElementById("kpis").innerHTML = cards.map(([l,v,h,a])=>
    `<div class="card" style="--accent:${a}"><div class="lbl">${l}</div>`+
    `<div class="val">${v}</div><div class="hint">${h}</div></div>`).join("");
}

function hourGraph(d) {
  const labels = d.hours.map(h=>String(h.hour_of_day).padStart(2,"0")+":00");
  const vals = d.hours.map(h=>h.avg_delay_seconds);
  const peaks = d.hours.map(h=>h.is_peak_window ? h.avg_delay_seconds : null);
  const ctx = document.getElementById("hourChart").getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,300);
  grad.addColorStop(0,"rgba(51,195,255,0.45)"); grad.addColorStop(1,"rgba(51,195,255,0.04)");
  if (hourChart) hourChart.destroy();
  hourChart = new Chart(ctx, {
    type:"line",
    data:{ labels, datasets:[
      { data:vals, borderColor:"#33C3FF", backgroundColor:grad, borderWidth:2,
        fill:true, tension:0.35, pointRadius:0 },
      { data:peaks, borderColor:"transparent", backgroundColor:"#FF6319",
        pointRadius:5, pointHoverRadius:7, showLine:false },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{
        label:c=>` ${c.parsed.y}s avg delay` } } },
      scales:{ x:{ grid:{color:"#1a2236"}, ticks:{color:"#8B95A7",maxRotation:0,autoSkip:true,maxTicksLimit:12} },
        y:{ grid:{color:"#1a2236"}, ticks:{color:"#8B95A7"}, title:{display:true,text:"avg delay (s)",color:"#8B95A7"} } } }
  });
  const ph = d.hours.filter(h=>h.is_peak_window).map(h=>String(h.hour_of_day).padStart(2,"0")+":00");
  document.getElementById("peakNote").textContent = ph.length ? "Peak windows: "+ph.join(", ") : "";
}

function routeGraph(d) {
  const rows = d.top_routes;
  const ctx = document.getElementById("routeChart").getContext("2d");
  if (routeChart) routeChart.destroy();
  routeChart = new Chart(ctx, {
    type:"bar",
    data:{ labels: rows.map(r=>r.name),
      datasets:[{ data:rows.map(r=>r.avg_delay_seconds),
        backgroundColor:rows.map(r=>r.color), borderRadius:5, barThickness:16 }] },
    options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{
        label:c=>` ${c.parsed.x}s avg · ${rows[c.dataIndex].mode}` } } },
      scales:{ x:{ grid:{color:"#1a2236"}, ticks:{color:"#8B95A7"}, title:{display:true,text:"avg delay (s)",color:"#8B95A7"} },
        y:{ grid:{display:false}, ticks:{color:"#C7D0E0",font:{weight:"600"}} } } }
  });
}

function stopsView(d) {
  const stops = d.stops.filter(s=>s.stop_lat!=null && s.stop_lon!=null);
  const tbody = document.querySelector("#stopTable tbody");
  const max = Math.max(1, ...d.stops.map(s=>s.total_scheduled_stops));
  tbody.innerHTML = d.stops.map(s=>{
    const w = Math.round(100*s.total_scheduled_stops/max);
    return `<tr><td class="num">${s.busy_rank}</td><td>${s.stop_name||"-"}</td>`+
      `<td><div class="num">${s.total_scheduled_stops.toLocaleString()}</div>`+
      `<div class="bar" style="width:${w}%"></div></td></tr>`;
  }).join("");

  if (!map) {
    map = L.map("map",{ zoomControl:true, attributionControl:false });
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      { maxZoom:19 }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
  }
  markerLayer.clearLayers();
  if (!stops.length) { map.setView([0,0],2); return; }
  const mx = Math.max(1, ...stops.map(s=>s.total_scheduled_stops));
  const pts = [];
  stops.forEach(s=>{
    const t = s.total_scheduled_stops/mx;
    const r = 6 + t*16;
    L.circleMarker([s.stop_lat,s.stop_lon],{
      radius:r, color:"#ffffff", weight:1, opacity:0.5,
      fillColor:"#00B5A0", fillOpacity:0.35+0.5*t
    }).bindTooltip(`${s.stop_name||"Stop"} · ${s.total_scheduled_stops.toLocaleString()} stop events`)
      .addTo(markerLayer);
    pts.push([s.stop_lat,s.stop_lon]);
  });
  map.fitBounds(pts, { padding:[30,30] });
}

function legend() {
  document.getElementById("legend").innerHTML = Object.entries(MODES)
    .filter(([k])=>k!=="Suburban rail")
    .map(([k,c])=>`<span class="badge" style="background:${c}">${k}</span>`).join("");
}

function render(city) {
  const d = DATA[city];
  document.getElementById("subtitle").textContent =
    `${d.title} · GTFS delay intelligence, ${Object.keys(DATA).length} cities loaded`;
  kpis(d); hourGraph(d); routeGraph(d); stopsView(d);
}

(function init(){
  const sel = document.getElementById("city");
  Object.keys(DATA).sort().forEach(c=>{
    const o = document.createElement("option");
    o.value = c; o.textContent = DATA[c].title;
    sel.appendChild(o);
  });
  sel.addEventListener("change", e=>render(e.target.value));
  legend();
  render(sel.value);
})();
</script>
